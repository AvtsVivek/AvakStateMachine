<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title description">
  <title id="title">Traffic light state graph</title>
  <desc id="description">The traffic light starts Red. Each UI Next trigger advances Red to Green, Green to Yellow, and Yellow to Red. If the signal is not operational, the guard rejects the transition and the current state remains active.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#334155" />
    </marker>
    <marker id="rejected-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#b45309" />
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .edge { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .rejected { fill: none; stroke: #b45309; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#rejected-arrow); }
      .state { stroke: #334155; stroke-width: 2.5; }
      .state-name { font-size: 20px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .label { font-size: 16px; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .rejected-label { font-size: 14px; fill: #92400e; text-anchor: middle; }
      .initial-label { font-size: 14px; text-anchor: middle; }
    </style>
  </defs>

  <text class="initial-label" x="30" y="252">Initial</text>
  <path class="edge" d="M 40 270 L 95 270" />

  <path class="edge" d="M 230 270 L 405 270" />
  <text class="label" x="317" y="253">Next (UI)</text>

  <path class="edge" d="M 555 270 L 730 270" />
  <text class="label" x="642" y="253">Next (UI)</text>

  <path class="edge" d="M 750 325 C 680 455 280 455 180 325" />
  <text class="label" x="465" y="434">Next (UI)</text>

  <path class="rejected" d="M 105 225 C 72 145 218 145 185 225" />
  <path class="rejected" d="M 415 225 C 382 145 528 145 495 225" />
  <path class="rejected" d="M 725 225 C 692 145 838 145 805 225" />
  <text class="rejected-label" x="465" y="100">SignalOperational guard denies Next when signal is unavailable</text>

  <circle class="state" cx="160" cy="270" r="68" fill="#FEE2E2" />
  <text class="state-name" x="160" y="270">Red</text>

  <circle class="state" cx="470" cy="270" r="72" fill="#DCFCE7" />
  <text class="state-name" x="470" y="270">Green</text>

  <circle class="state" cx="780" cy="270" r="68" fill="#FEF3C7" />
  <text class="state-name" x="780" y="270">Yellow</text>

  <text x="480" y="486" font-size="14" text-anchor="middle" fill="#475569">Solid arrows: accepted transitions · Dashed loops: guard-denied triggers leave the state unchanged</text>
</svg>
